name: Uppdatera manualindex

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 0"

permissions:
  contents: write

concurrency:
  group: update-manual-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Hämta repot
        uses: actions/checkout@v6

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Bygg index
        run: python scripts/build_index.py

      - name: Commit om indexet har ändrats
        shell: bash
        run: |
          if git diff --quiet -- manual-index.md manual-index.json; then
            echo "Inga ändringar att committa."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual-index.md manual-index.json
          git commit -m "Uppdatera manualindex"
          git push
